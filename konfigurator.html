<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>WoodTerm — Konfigurator Balii</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; }

  #canvas-wrap { flex: 1; position: relative; }
  canvas { width: 100% !important; height: 100% !important; display: block; }

  #panel {
    width: 280px; background: #111; color: #eee;
    padding: 24px 20px; display: flex; flex-direction: column; gap: 20px;
    overflow-y: auto;
  }
  #panel h1 { font-size: 18px; font-weight: 300; letter-spacing: 2px; color: #fff; }
  #panel h1 span { color: #c8a96e; font-weight: 600; }

  .section { border-top: 1px solid #2a2a2a; padding-top: 16px; }
  .section h3 { font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
                color: #666; margin-bottom: 12px; }

  .ctrl { display: flex; align-items: center; justify-content: space-between;
          margin-bottom: 10px; }
  .ctrl label { font-size: 13px; color: #bbb; }

  input[type=color] {
    width: 40px; height: 28px; border: none; border-radius: 4px;
    cursor: pointer; background: none; padding: 0;
  }

  .swatch-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .swatch {
    width: 28px; height: 28px; border-radius: 4px; cursor: pointer;
    border: 2px solid transparent; transition: border-color .2s;
  }
  .swatch:hover, .swatch.active { border-color: #c8a96e; }

  #info { font-size: 11px; color: #444; margin-top: auto; line-height: 1.6; }
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #888; font-size: 14px; letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="canvas-wrap">
  <div id="loading">Ładowanie modelu…</div>
  <canvas id="c"></canvas>
</div>

<div id="panel">
  <h1>WOOD<span>TERM</span></h1>

  <div class="section">
    <h3>Elewacja (drewno)</h3>
    <div class="ctrl">
      <label>Kolor</label>
      <input type="color" id="col_elewacja" value="#3d2010">
    </div>
    <div class="swatch-row" id="sw_elewacja">
      <div class="swatch active" style="background:#3d2010" data-color="#3d2010" data-target="col_elewacja"></div>
      <div class="swatch" style="background:#5c3a1e" data-color="#5c3a1e" data-target="col_elewacja"></div>
      <div class="swatch" style="background:#8b6347" data-color="#8b6347" data-target="col_elewacja"></div>
      <div class="swatch" style="background:#c4a882" data-color="#c4a882" data-target="col_elewacja"></div>
      <div class="swatch" style="background:#2c2c2c" data-color="#2c2c2c" data-target="col_elewacja"></div>
    </div>
  </div>

  <div class="section">
    <h3>Niecka (akryl)</h3>
    <div class="ctrl">
      <label>Kolor</label>
      <input type="color" id="col_niecka" value="#e0e0e5">
    </div>
    <div class="swatch-row" id="sw_niecka">
      <div class="swatch active" style="background:#e0e0e5" data-color="#e0e0e5" data-target="col_niecka"></div>
      <div class="swatch" style="background:#c8d8e0" data-color="#c8d8e0" data-target="col_niecka"></div>
      <div class="swatch" style="background:#d4e8d4" data-color="#d4e8d4" data-target="col_niecka"></div>
      <div class="swatch" style="background:#e8d4d4" data-color="#e8d4d4" data-target="col_niecka"></div>
      <div class="swatch" style="background:#1a1a2e" data-color="#1a1a2e" data-target="col_niecka"></div>
    </div>
  </div>

  <div class="section">
    <h3>Obejma</h3>
    <div class="ctrl">
      <label>Kolor</label>
      <input type="color" id="col_obejma" value="#c0c0c8">
    </div>
    <div class="swatch-row" id="sw_obejma">
      <div class="swatch active" style="background:#c0c0c8" data-color="#c0c0c8" data-target="col_obejma"></div>
      <div class="swatch" style="background:#8b7355" data-color="#8b7355" data-target="col_obejma"></div>
      <div class="swatch" style="background:#c8a040" data-color="#c8a040" data-target="col_obejma"></div>
      <div class="swatch" style="background:#1a1a1a" data-color="#1a1a1a" data-target="col_obejma"></div>
    </div>
  </div>

  <div class="section">
    <h3>Widok</h3>
    <div class="ctrl">
      <label>Auto-obrót</label>
      <input type="checkbox" id="autorot" checked>
    </div>
    <div class="ctrl">
      <label>Tło</label>
      <input type="color" id="bg_color" value="#1a1a1a">
    </div>
  </div>

  <div id="info">
    WoodTerm Konfigurator · Kliknij i przeciągnij aby obracać · Scroll aby zoom
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// Scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1a1a');

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
camera.position.set(1.8, 1.2, 1.8);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 0.5;
controls.maxDistance = 5;
controls.maxPolarAngle = Math.PI / 1.8;

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff8f0, 2.0);
sun.position.set(2, 4, 2);
sun.castShadow = true;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xe8f0ff, 0.6);
fill.position.set(-2, 1, -1);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.4);
rim.position.set(0, -1, -2);
scene.add(rim);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(2, 64),
  new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Material map
const matMap = {};

// Load GLB
const loader = new GLTFLoader();
loader.load('balia_split.glb', (gltf) => {
  const model = gltf.scene;

  // Skalowanie i pozycja
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const scale = 1.6 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(scale);

  const center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);

  model.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;

      const matName = obj.material?.name || '';
      if (!matMap[matName]) {
        matMap[matName] = obj.material;
        obj.material = obj.material.clone();
        matMap[matName] = obj.material;
      } else {
        obj.material = matMap[matName];
      }
    }
  });

  scene.add(model);
  document.getElementById('loading').style.display = 'none';
}, undefined, (err) => {
  document.getElementById('loading').textContent = 'Błąd ładowania: ' + err.message;
});

// Color helpers
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return new THREE.Color(r,g,b);
}

function applyColor(matName, hex) {
  const mat = matMap[matName];
  if (mat) mat.color.set(hexToRgb(hex));
}

// UI controls
const targets = {
  'col_elewacja': 'mat_elewacja',
  'col_niecka':   'mat_niecka',
  'col_obejma':   'mat_obejma',
};

Object.entries(targets).forEach(([inputId, matName]) => {
  const input = document.getElementById(inputId);
  input.addEventListener('input', e => applyColor(matName, e.target.value));
});

// Swatches
document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    const targetInput = document.getElementById(sw.dataset.target);
    const color = sw.dataset.color;
    targetInput.value = color;
    applyColor(targets[sw.dataset.target], color);
    // Active state
    document.querySelectorAll(`[data-target="${sw.dataset.target}"]`).forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
  });
});

// Auto-rotate
const autorot = document.getElementById('autorot');
autorot.addEventListener('change', e => { controls.autoRotate = e.target.checked; });
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// Background color
document.getElementById('bg_color').addEventListener('input', e => {
  scene.background = new THREE.Color(e.target.value);
});

// Resize
function resize() {
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);
resize();

// Render loop
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
